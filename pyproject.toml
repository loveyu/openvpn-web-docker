[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "SIM", "RUF"]
preview = false

[tool.ruff.lint.per-file-ignores]
"scripts/smoke.py" = ["B904", "RUF001", "RUF002", "RUF003"]
