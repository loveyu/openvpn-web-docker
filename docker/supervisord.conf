[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=%(ENV_CONFIG_DIR)s/logs/supervisor.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/run/supervisord.pid
umask=0077

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:backend]
command=/usr/local/bin/openvpn-web
priority=10
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=%(ENV_CONFIG_DIR)s/logs/backend.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true

[program:bootstrap]
command=/usr/local/bin/openvpn-web runtime bootstrap
priority=20
autostart=true
autorestart=false
startsecs=0
stdout_logfile=%(ENV_CONFIG_DIR)s/logs/bootstrap.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true

[program:httpdns-probe]
command=/usr/local/bin/openvpn-web runtime httpdns-probe
priority=15
autostart=true
autorestart=false
startsecs=0
stdout_logfile=%(ENV_CONFIG_DIR)s/logs/httpdns.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true

[program:health]
command=/usr/local/bin/openvpn-web runtime health-worker
priority=50
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_CONFIG_DIR)s/logs/health.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true

[program:openvpn]
command=/usr/sbin/openvpn --config /run/vpnweb/openvpn.conf
priority=30
autostart=false
autorestart=true
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=%(ENV_CONFIG_DIR)s/logs/openvpn.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true

[program:http]
stopasgroup=true
killasgroup=true
command=/bin/sh /usr/local/lib/vpnweb/http-run.sh
priority=40
autostart=false
autorestart=true
stdout_logfile=%(ENV_CONFIG_DIR)s/logs/http.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true

[program:socks5]
command=/usr/local/bin/openvpn-web runtime socks-run
priority=40
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_CONFIG_DIR)s/logs/socks5.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true

[program:sshd]
command=/usr/sbin/sshd -D -e -f /run/vpnweb/sshd_config
priority=40
autostart=false
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_CONFIG_DIR)s/logs/sshd.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
