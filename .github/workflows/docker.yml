name: Check and publish Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install quality tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n -l
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck shfmt
          quality_dir="$RUNNER_TEMP/openvpn-web-quality"
          python3 -m venv "$quality_dir"
          "$quality_dir/bin/pip" install --disable-pip-version-check --no-cache-dir \
            ruff==0.15.10 yamllint==1.37.1
          echo "$quality_dir/bin" >> "$GITHUB_PATH"
          curl --fail --silent --show-error --location \
            https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz \
            | gzip -d > "$quality_dir/taplo"
          curl --fail --silent --show-error --location \
            https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64 \
            -o "$quality_dir/hadolint"
          chmod +x "$quality_dir/taplo" "$quality_dir/hadolint"
          echo "$quality_dir" >> "$GITHUB_PATH"
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile --loglevel error
      - name: Quality checks
        run: ./scripts/check.sh

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build native image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: openvpn-web:ci
          pull: true
          no-cache-filters: runtime
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Container integration tests
        run: python3 scripts/smoke.py --image openvpn-web:ci
      - name: Image name
        if: github.event_name != 'pull_request'
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified architecture
        if: github.event_name != 'pull_request'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag openvpn-web:ci "$IMAGE_NAME:$GITHUB_SHA-$ARCH"
          docker push "$IMAGE_NAME:$GITHUB_SHA-$ARCH"

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - name: Publish multi-architecture manifest
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          arguments=()
          while IFS= read -r tag; do
            arguments+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${arguments[@]}" \
            "$IMAGE_NAME:$GITHUB_SHA-amd64" "$IMAGE_NAME:$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE_NAME:sha-$GITHUB_SHA"
