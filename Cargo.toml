[package]
name = "openvpn-web"
version = "0.1.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = "2.1.1"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "process",
    "signal",
    "sync",
    "time",
    "fs",
    "io-util",
] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
